<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permiso de Micrófono — LivecodeAE Spaces</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --card: #18181b;
      --accent-green: #22c55e;
      --accent-cyan: #38bdf8;
      --accent-rose: #f43f5e;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
      overflow: hidden;
    }
    .permission-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .icon-mic {
      font-size: 38px;
      margin-bottom: 10px;
      animation: bounce 1.2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .status-badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
      font-size: 11px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .btn-manual-allow {
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      color: #000;
      border: none;
      font-weight: 800;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="permission-card">
    <div class="icon-mic" id="micIcon">🎙️</div>
    <div class="title">LivecodeAE Spaces</div>
    <div class="desc">
      Presiona <strong>"Permitir"</strong> cuando el navegador te lo solicite. Una vez dado el permiso, esta ventana desaparecerá automáticamente.
    </div>
    <div class="status-badge" id="statusBadge">Esperando permiso del micrófono...</div>
    <button class="btn-manual-allow" id="btnManual" onclick="initMic()">👉 Conceder Permiso Ahora</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = (urlParams.get('room') || 'GENERAL').toUpperCase().trim();
    const userName = urlParams.get('name') || 'Programador LivecodeAE';

    let socket = null;
    let localStream = null;
    let audioInCtx = null;
    let isMuted = false;
    const SAMPLE_RATE = 48000;

    async function initMic() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: SAMPLE_RATE,
            channelCount: 1
          },
          video: false
        });

        document.getElementById('statusBadge').innerText = '✅ ¡Micrófono Autorizado! Ocultando ventana...';
        document.getElementById('statusBadge').style.borderColor = 'rgba(34, 197, 94, 0.5)';
        document.getElementById('statusBadge').style.color = 'var(--accent-green)';
        document.getElementById('micIcon').innerText = '🟢';

        setupSocketAndAudio(localStream);

        // Ocultar y cerrar ventana automáticamente: el control queda 100% en VS Code
        setTimeout(() => {
          try {
            window.moveTo(-32000, -32000);
            window.resizeTo(1, 1);
            window.blur();
            window.close();
          } catch(e) {}
        }, 600);

      } catch (err) {
        document.getElementById('statusBadge').innerText = '⚠️ Por favor haz clic en Permitir Micrófono';
        document.getElementById('statusBadge').style.color = 'var(--accent-rose)';
        document.getElementById('btnManual').style.display = 'block';
      }
    }

    function setupSocketAndAudio(stream) {
      socket = io({ transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        socket.emit('join-room', {
          roomId,
          name: userName,
          isVoiceOnly: true
        });
        socket.emit('voice-join', {
          roomId,
          name: userName
        });
      });

      // Control remoto de mute desde VS Code
      socket.on('voice-mute-command', (data) => {
        if (data.name && data.name.trim().toLowerCase() === userName.trim().toLowerCase()) {
          isMuted = !!data.muted;
        }
      });

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioInCtx = new AudioCtx({ sampleRate: SAMPLE_RATE });
      const source = audioInCtx.createMediaStreamSource(stream);
      const proc = audioInCtx.createScriptProcessor(2048, 1, 1);
      source.connect(proc);
      proc.connect(audioInCtx.destination);

      proc.onaudioprocess = (e) => {
        if (isMuted || !socket || !socket.connected) return;
        const input = e.inputBuffer.getChannelData(0);

        let sum = 0;
        for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
        const rms = Math.sqrt(sum / input.length);

        if (rms > 0.02) {
          socket.emit('voice-speaking', { roomId, speaking: true });
        }

        const int16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          int16[i] = Math.max(-1, Math.min(1, input[i])) * 32767;
        }
        socket.emit('voice-audio-pcm', { roomId, pcm: Array.from(int16) });
      };
    }

    // Auto-iniciar la petición de permiso
    window.addEventListener('DOMContentLoaded', initMic);
    setTimeout(initMic, 200);
  </script>
</body>
</html>
