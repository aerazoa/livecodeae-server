<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LivecodeAE Audio Bridge (48 kHz Studio)</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --card: #18181b;
      --accent-green: #22c55e;
      --accent-cyan: #38bdf8;
      --accent-rose: #f43f5e;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      user-select: none;
      overflow: hidden;
    }
    .widget-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 280px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .badge-live {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: var(--accent-green);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.8); opacity: 0.4; }
    }
    .room-title {
      font-size: 11px;
      font-family: monospace;
      color: var(--accent-cyan);
    }
    .avatar-wrapper {
      position: relative;
      width: 68px;
      height: 68px;
      margin: 0 auto 10px auto;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-cyan);
      transition: all 0.2s;
    }
    .avatar-wrapper.speaking .avatar-img {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.3);
    }
    .user-name {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .status-note {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .btn-toggle-mic {
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-toggle-mic.unmuted {
      background: var(--accent-green);
      color: #000;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
    }
    .btn-toggle-mic.muted {
      background: var(--accent-rose);
      color: #fff;
    }
    .tip-footer {
      font-size: 9px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="widget-box">
    <div class="header">
      <div class="badge-live">
        <span class="dot"></span> 48 kHz HD
      </div>
      <span class="room-title" id="roomLabel"></span>
    </div>

    <div class="avatar-wrapper" id="avatarWrapper">
      <img id="avatarImg" class="avatar-img" src="" alt="Avatar" />
    </div>

    <div class="user-name" id="userNameLabel">Conectando...</div>
    <div class="status-note" id="statusNote">Iniciando audio de alta fidelidad...</div>

    <button class="btn-toggle-mic unmuted" id="btnMic" onclick="toggleMute()">
      <span id="micIcon">🎙️</span> <span id="micText">Micrófono HD Activo</span>
    </button>

    <div class="tip-footer">
      💡 Audio en segundo plano sincronizado con LivecodeAE Spaces dentro de VS Code.
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = (urlParams.get('room') || 'GENERAL').toUpperCase().trim();
    const userName = urlParams.get('name') || 'Programador LivecodeAE';

    document.getElementById('roomLabel').innerText = roomId;
    document.getElementById('userNameLabel').innerText = userName;
    document.getElementById('avatarImg').src = 'https://api.dicebear.com/7.x/personas/svg?seed=' + encodeURIComponent(userName);

    let socket = null;
    let localStream = null;
    let audioInCtx = null;
    let audioOutCtx = null;
    let isMuted = false;

    // Alta Fidelidad: 48 kHz Studio Quality
    const SAMPLE_RATE = 48000;

    async function init() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: SAMPLE_RATE,
            channelCount: 1
          },
          video: false
        });

        document.getElementById('statusNote').innerText = '48 kHz HD • Audio Estudio sin eco';

        socket = io({ transports: ['websocket', 'polling'] });

        socket.on('connect', () => {
          socket.emit('join-room', {
            roomId,
            name: userName,
            isVoiceOnly: true
          });
          socket.emit('voice-join', { roomId });
        });

        socket.on('voice-audio-pcm', (data) => {
          if (data.senderUserId !== socket.id) {
            playRemoteAudio(data.pcm);
          }
        });

        setupRecording(localStream);
      } catch (err) {
        document.getElementById('statusNote').innerText = 'Micrófono no autorizado';
        document.getElementById('statusNote').style.color = 'var(--accent-rose)';
      }
    }

    function setupRecording(stream) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioInCtx = new AudioCtx({ sampleRate: SAMPLE_RATE });
      const source = audioInCtx.createMediaStreamSource(stream);
      // Tamaño de buffer 2048 a 48 kHz = 42ms de latencia ultra baja
      const proc = audioInCtx.createScriptProcessor(2048, 1, 1);
      source.connect(proc);
      proc.connect(audioInCtx.destination);

      proc.onaudioprocess = (e) => {
        if (isMuted || !socket || !socket.connected) return;
        const input = e.inputBuffer.getChannelData(0);

        let sum = 0;
        for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
        const rms = Math.sqrt(sum / input.length);

        const wrap = document.getElementById('avatarWrapper');
        if (rms > 0.02) {
          wrap.classList.add('speaking');
          socket.emit('voice-speaking', { roomId, speaking: true });
        } else {
          wrap.classList.remove('speaking');
        }

        const int16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          int16[i] = Math.max(-1, Math.min(1, input[i])) * 32767;
        }
        socket.emit('voice-audio-pcm', { roomId, pcm: Array.from(int16) });
      };
    }

    function playRemoteAudio(pcmArray) {
      try {
        if (!audioOutCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          audioOutCtx = new AudioCtx({ sampleRate: SAMPLE_RATE });
        }
        if (audioOutCtx.state === 'suspended') audioOutCtx.resume();

        const buffer = audioOutCtx.createBuffer(1, pcmArray.length, SAMPLE_RATE);
        const channel = buffer.getChannelData(0);
        for (let i = 0; i < pcmArray.length; i++) {
          channel[i] = pcmArray[i] / 32767;
        }

        const source = audioOutCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioOutCtx.destination);
        source.start();
      } catch (e) {}
    }

    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('btnMic');
      const icon = document.getElementById('micIcon');
      const text = document.getElementById('micText');
      if (isMuted) {
        btn.className = 'btn-toggle-mic muted';
        icon.innerText = '🔇';
        text.innerText = 'Silenciado';
        document.getElementById('avatarWrapper').classList.remove('speaking');
        if (socket) socket.emit('voice-speaking', { roomId, speaking: false });
      } else {
        btn.className = 'btn-toggle-mic unmuted';
        icon.innerText = '🎙️';
        text.innerText = 'Micrófono HD Activo';
      }
    }

    init();
  </script>
</body>
</html>
