<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activar Micrófono — LivecodeAE Spaces</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --card: #18181b;
      --accent-green: #22c55e;
      --accent-cyan: #38bdf8;
      --accent-rose: #f43f5e;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
    }
    .icon-box {
      font-size: 42px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn-activate {
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      color: #000;
      border: none;
      font-weight: 800;
      font-size: 14px;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.35);
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-activate:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }
    .status-badge {
      font-size: 11px;
      color: var(--accent-cyan);
      margin-top: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box" id="iconBox">🎙️</div>
    <div class="title">LivecodeAE Spaces</div>
    <div class="desc" id="descText">
      Haz clic en el botón de abajo para activar tu micrófono. Una vez concedido, <strong>esta ventana se cerrará sola</strong> y hablarás directamente desde VS Code.
    </div>

    <button class="btn-activate" id="btnAction" onclick="activateMicrophone()">
      <span>🎙️</span> <span>Activar y Conceder Permiso</span>
    </button>

    <div class="status-badge" id="statusBadge">Esperando tu confirmación...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = (urlParams.get('room') || 'GENERAL').toUpperCase().trim();
    const userName = urlParams.get('name') || 'Programador LivecodeAE';

    let socket = null;
    let localStream = null;
    let audioInCtx = null;
    let isMuted = false;
    const SAMPLE_RATE = 48000;

    async function activateMicrophone() {
      const btn = document.getElementById('btnAction');
      const badge = document.getElementById('statusBadge');
      btn.disabled = true;
      btn.style.opacity = '0.7';
      badge.innerText = 'Solicitando acceso al micrófono...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: SAMPLE_RATE,
            channelCount: 1
          },
          video: false
        });

        document.getElementById('iconBox').innerText = '🟢';
        badge.innerText = '✅ ¡Micrófono HD Concedido! Cerrando ventana...';
        badge.style.color = 'var(--accent-green)';

        setupSocketAndAudio(localStream);

        // Notificar y cerrar ventana automáticamente tras medio segundo
        setTimeout(() => {
          try {
            window.close();
          } catch(e) {}
        }, 600);

      } catch (err) {
        btn.disabled = false;
        btn.style.opacity = '1';
        badge.innerText = '⚠️ Debes presionar "Permitir" en el aviso del navegador';
        badge.style.color = 'var(--accent-rose)';
      }
    }

    function setupSocketAndAudio(stream) {
      socket = io({ transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        socket.emit('join-room', {
          roomId,
          name: userName,
          isVoiceOnly: true
        });
        socket.emit('voice-join', {
          roomId,
          name: userName
        });
      });

      socket.on('voice-mute-command', (data) => {
        if (data.name && data.name.trim().toLowerCase() === userName.trim().toLowerCase()) {
          isMuted = !!data.muted;
        }
      });

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioInCtx = new AudioCtx({ sampleRate: SAMPLE_RATE });
      const source = audioInCtx.createMediaStreamSource(stream);
      const proc = audioInCtx.createScriptProcessor(2048, 1, 1);
      source.connect(proc);
      proc.connect(audioInCtx.destination);

      proc.onaudioprocess = (e) => {
        if (isMuted || !socket || !socket.connected) return;
        const input = e.inputBuffer.getChannelData(0);

        let sum = 0;
        for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
        const rms = Math.sqrt(sum / input.length);

        if (rms > 0.02) {
          socket.emit('voice-speaking', { roomId, speaking: true });
        }

        const int16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          int16[i] = Math.max(-1, Math.min(1, input[i])) * 32767;
        }
        socket.emit('voice-audio-pcm', { roomId, pcm: Array.from(int16) });
      };
    }

    // Si el usuario ya había otorgado permiso en una sesión anterior, se conecta al cargar
    if (navigator.permissions) {
      navigator.permissions.query({ name: 'microphone' }).then(result => {
        if (result.state === 'granted') {
          activateMicrophone();
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
